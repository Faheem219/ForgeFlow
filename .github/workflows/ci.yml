name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + type + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (Python 3.11)
        run: uv sync --python 3.11

      - name: Ruff
        run: uv run ruff check .

      - name: Black (check)
        run: uv run black --check .

      - name: Mypy
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest -q

  config-guard:
    name: Config layering guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No direct os.environ outside config layer
        run: bash infra/scripts/check_no_os_environ.sh

  frontend:
    name: Frontend (lint + type + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm 9)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: Prettier (check)
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test -- --run

      - name: Build
        run: pnpm run build
