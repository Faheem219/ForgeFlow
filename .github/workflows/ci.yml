name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + type + tests)
    runs-on: ubuntu-latest
    # The suite runs in well under this. A hung test (e.g. a leaked dev server blocking teardown)
    # should fail the run in minutes, not hold a runner for GitHub's 6-hour default.
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (Python 3.11)
        run: uv sync --python 3.11

      - name: Ruff
        run: uv run ruff check .

      - name: Black (check)
        run: uv run black --check .

      - name: Mypy
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest -q

  config-guard:
    name: Config layering guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No direct os.environ outside config layer
        run: bash infra/scripts/check_no_os_environ.sh

  sandbox:
    name: Sandbox image (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and run Node + Playwright smoke
        run: bash sandbox/smoke/run_smoke.sh

  security:
    name: Security (secret scan + dependency audit)
    runs-on: ubuntu-latest
    steps:
      # Full history: a secret that was committed and later removed is still leaked.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Committed-secret guard
        run: bash infra/scripts/check_no_committed_secrets.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python dependency audit
        working-directory: backend
        run: |
          uv sync --python 3.11
          uv run --with pip-audit pip-audit --progress-spinner off || \
            echo "::warning title=pip-audit::Advisories found — triage before release (see docs/hardening-checklist.md §7)"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm 9)
        run: corepack enable

      - name: Node dependency audit
        working-directory: frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm audit --audit-level high || \
            echo "::warning title=pnpm-audit::Advisories found — triage before release (see docs/hardening-checklist.md §7)"

  frontend:
    name: Frontend (lint + type + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm 9)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: Prettier (check)
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test -- --run

      - name: Build
        run: pnpm run build

      - name: PWA installability + caching check
        run: pnpm run check:pwa

  skeleton:
    name: App skeleton (install + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/app-skeleton
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm 9)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build FE + BE
        run: pnpm run build

      - name: Unit tests (Vitest + Jest)
        run: pnpm run test:unit

      - name: Install Playwright chromium
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: E2E (Playwright, boots the FE preview)
        run: pnpm run test:e2e
