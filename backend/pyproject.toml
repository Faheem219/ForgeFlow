[project]
name = "forgeflow-backend"
version = "0.1.0"
description = "ForgeFlow control plane (FastAPI)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "motor>=3.5",
    "beanie>=1.26,<2",  # 1.x is Motor-based (§4 stack); 2.x switched to pymongo-async
    "anthropic>=0.39",
    "docker>=7.1",
    "httpx>=0.27",
    "cryptography>=43",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0.1,<4.1",  # passlib 1.7.4 breaks with bcrypt>=4.1 (72-byte self-test)
    "websockets>=12",
    "pyyaml>=6.0",  # benchmark specs are authored in YAML (phase-43) — prose reads badly as JSON
    "prometheus-client>=0.20",  # /metrics exposition for the Prometheus+Grafana stack (devops)
]

[project.optional-dependencies]
# Needed when LLM_PROVIDER=openai (phase-53). Kept as an extra so a bare Anthropic-only install
# stays possible, but every shipped install (Dockerfiles, Makefile, CI) passes `--extra openai`
# because the OpenAI-compatible transport is the primary interface (phase-60).
openai = ["openai>=1.40"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
]

[tool.uv]
# Application project (not a distributable package): don't try to build/install `app` as a wheel.
package = false

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "docker: integration test needing a Docker/Node(pnpm) toolchain (opt-in; skipped by default)",
]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A", "W"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI intentionally calls these in argument defaults (dependency injection).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Security",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# The error taxonomy name `SystemError` intentionally shadows the builtin (mandated by the plan);
# A004 = import of a builtin-shadowing name, raised wherever `SystemError` is imported.
"app/core/errors.py" = ["A001", "A002", "A003", "A004"]
"app/core/config.py" = ["A001", "A002", "A003", "A004"]
"tests/*" = ["A004"]
# The docker-SDK test double mirrors real method signatures (e.g. containers.list(all=...)).
"tests/sandbox/fakes.py" = ["A002", "E501"]

# ------------------------------------------------------------------ black
[tool.black]
line-length = 100
target-version = ["py311"]

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.11"
# Both the control plane and the sandbox run on Linux (Docker via Colima). Checking against the
# host's platform instead makes POSIX-only stdlib calls look like errors on a Windows dev machine.
platform = "linux"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_unused_ignores = true
files = ["app", "tests"]
