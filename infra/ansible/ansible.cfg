# Ansible config for the ForgeFlow VM. Ansible reads the ansible.cfg in the CURRENT DIRECTORY, so
# every command below assumes you are inside infra/ansible/.
#
# Control node: any POSIX machine — macOS (`brew install ansible`) or Linux/WSL
# (`pipx install ansible`). There is no native Windows control node, which is why the WSL path is
# documented in README.md. Nothing in this config is OS-specific.
[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
# The old `stdout_callback = yaml` pointed at community.general's yaml plugin, removed in
# community.general 12. The built-in callback grew the same output format in core 2.13.
stdout_callback = default
callback_result_format = yaml
# Show which tasks actually changed something — the whole point of an idempotent run is that the
# second one is all green, and that is much easier to read in YAML than the default line callback.
display_skipped_hosts = False
interpreter_python = auto_silent
forks = 10

[ssh_connection]
# Reuse one SSH connection for the whole run. Over a long-haul link to an Oracle region this is the
# difference between a 3-minute play and a 15-minute one.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey

[privilege_escalation]
become = True
become_method = sudo
become_user = root
