# Copy to `inventory.ini` and fill in. `inventory.ini` is gitignored — it holds your VM's real
# address, and an inventory in a public repo is a free target list.
#
#   cp inventory.example.ini inventory.ini
#
# Check connectivity before running the playbook:
#   ansible forgeflow -m ping

[forgeflow]
# One host. Give it a friendly alias so playbook output is readable, and put the real address in
# ansible_host — that way the alias can stay stable if the IP ever changes.
oracle-vm ansible_host=CHANGE_ME.your.ip.or.hostname

[forgeflow:vars]
# The user your SSH key authorises. Oracle's Ubuntu images ship with `ubuntu`; their Oracle Linux
# images use `opc`.
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/your_oracle_key
ansible_python_interpreter=/usr/bin/python3
ansible_port=22
