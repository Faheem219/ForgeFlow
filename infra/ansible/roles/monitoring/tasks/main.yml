---
# Prometheus + Grafana + exporters (assignment step 4).
#
# Unlike the forgeflow role, this one DOES start its stack. The monitoring stack has no
# release cycle — there is no image for CD to push — so there is nothing to wait for, and a
# monitoring system you have to remember to start by hand is one that will be off when you need it.

- name: Create the monitoring directory tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ forgeflow_user }}"
    group: "{{ forgeflow_group }}"
    mode: "0750"
  loop:
    - "{{ monitoring_root }}"
    - "{{ monitoring_root }}/prometheus"
    - "{{ monitoring_root }}/blackbox"
    - "{{ monitoring_root }}/grafana/provisioning/datasources"
    - "{{ monitoring_root }}/grafana/provisioning/dashboards"
    - "{{ monitoring_root }}/grafana/dashboards"
  when: monitoring_enabled | bool

- name: Install the monitoring compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../monitoring/docker-compose.monitoring.yml"
    dest: "{{ monitoring_root }}/docker-compose.monitoring.yml"
    owner: "{{ forgeflow_user }}"
    group: "{{ forgeflow_group }}"
    mode: "0640"
  when: monitoring_enabled | bool
  notify: Restart monitoring

- name: Template the Prometheus scrape config
  # Templated, not copied: the blackbox job must probe YOUR domain, and the API scrape must use
  # the port you actually bound. The repo copy ships a CHANGE_ME placeholder precisely so an
  # unconfigured deployment fails visibly rather than silently probing nothing.
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_root }}/prometheus/prometheus.yml"
    owner: "{{ forgeflow_user }}"
    group: "{{ forgeflow_group }}"
    mode: "0640"
  when: monitoring_enabled | bool
  notify: Reload prometheus

- name: Install the alert rules
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../monitoring/prometheus/alerts.yml"
    dest: "{{ monitoring_root }}/prometheus/alerts.yml"
    owner: "{{ forgeflow_user }}"
    group: "{{ forgeflow_group }}"
    mode: "0640"
  when: monitoring_enabled | bool
  notify: Reload prometheus

- name: Install the blackbox probe config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../monitoring/blackbox/blackbox.yml"
    dest: "{{ monitoring_root }}/blackbox/blackbox.yml"
    owner: "{{ forgeflow_user }}"
    group: "{{ forgeflow_group }}"
    mode: "0640"
  when: monitoring_enabled | bool
  notify: Restart monitoring

- name: Install the Grafana provisioning + dashboards
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../monitoring/grafana/{{ item }}"
    dest: "{{ monitoring_root }}/grafana/{{ item | dirname }}/"
    owner: "{{ forgeflow_user }}"
    group: "{{ forgeflow_group }}"
    mode: "0640"
  loop:
    - provisioning/datasources/prometheus.yml
    - provisioning/dashboards/dashboards.yml
    - dashboards/forgeflow-overview.json
  when: monitoring_enabled | bool
  notify: Restart monitoring

- name: Write the monitoring environment file
  ansible.builtin.copy:
    content: |
      # Generated by Ansible. Holds the Grafana admin password — hence 0640, not 0644.
      GRAFANA_ADMIN_USER={{ monitoring_grafana_admin_user }}
      GRAFANA_ADMIN_PASSWORD={{ monitoring_grafana_admin_password }}
      GRAFANA_PORT={{ monitoring_grafana_port }}
      PROM_PORT={{ monitoring_prometheus_port }}
      PROM_RETENTION={{ monitoring_prometheus_retention }}
    dest: "{{ monitoring_root }}/.env"
    owner: "{{ forgeflow_user }}"
    group: "{{ forgeflow_group }}"
    mode: "0640"
  no_log: true
  when: monitoring_enabled | bool
  notify: Restart monitoring

- name: Warn if the Grafana password is still the default
  ansible.builtin.debug:
    msg: >-
      WARNING: monitoring_grafana_admin_password is still the shipped default. Grafana is bound to
      127.0.0.1 so this is not immediately exploitable, but change it in group_vars before you ever
      expose port {{ monitoring_grafana_port }}.
  when:
    - monitoring_enabled | bool
    - "'changeme' in monitoring_grafana_admin_password"

- name: Install the monitoring systemd unit
  ansible.builtin.template:
    src: forgeflow-monitoring.service.j2
    dest: /etc/systemd/system/forgeflow-monitoring.service
    owner: root
    group: root
    mode: "0644"
  when: monitoring_enabled | bool
  notify: Reload systemd

- name: Enable and start monitoring
  ansible.builtin.systemd:
    name: forgeflow-monitoring
    enabled: true
    state: started
    daemon_reload: true
  when: monitoring_enabled | bool

- name: Report how to reach the dashboards
  ansible.builtin.debug:
    msg: >-
      Monitoring is up, bound to loopback. Tunnel in from your laptop:
      `ssh -L {{ monitoring_grafana_port }}:127.0.0.1:{{ monitoring_grafana_port }}
      -L {{ monitoring_prometheus_port }}:127.0.0.1:{{ monitoring_prometheus_port }}
      {{ ansible_user }}@{{ ansible_host | default(inventory_hostname) }}`
      then open http://localhost:{{ monitoring_grafana_port }}
      (user {{ monitoring_grafana_admin_user }}).
  when: monitoring_enabled | bool
