# ForgeFlow local dev stack: api + web + mongo + appdb + proxy.
# Bring up with `make dev` (needs Colima/Docker running). Copy `.env.example` -> `.env` first.
name: forgeflow

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The database the GENERATED apps use — deliberately separate from `mongo` (the control plane's
  # metadata), and the only stateful service on the preview network. A sandbox is on an `internal`
  # network with no route to the host, so a `localhost` connection string can never work from
  # inside one: the generated backend boots and then every query dies with mongoose's
  # "buffering timed out after 10000ms". Point APP_DB_CLUSTER_URI at this and it resolves by name.
  #
  # Per-project isolation stays what D8 specifies: one database per project inside the cluster.
  appdb:
    image: mongo:7
    container_name: forgeflow-appdb
    # `always`, not `unless-stopped`, and deliberately: this and `proxy` are the two containers a
    # preview needs but nobody re-runs compose for. They are started detached (`make host-deps`)
    # and then expected to just be there, while `unless-stopped` explicitly does NOT restart a
    # container that was stopped when the daemon went down -- which is every docker restart. The
    # sandbox, meanwhile, comes back on demand via the sandbox manager, so the failure lands as
    # "the generated app cannot resolve forgeflow-appdb" long after the restart that caused it.
    restart: always
    ports:
      # 27018 on the host (27017 is the control-plane mongo) so a control plane running *outside*
      # docker — `uvicorn` on the host — can still reach it for provisioning + the data browser.
      # The sandboxes reach the same server by name on the preview network; see APP_DB_SANDBOX_URI.
      - "27018:27017"
    volumes:
      - appdb-data:/data/db
    networks:
      # `default` so the control plane can reach it to provision/browse; `preview` so the sandboxes
      # can. It never gets a published port — nothing outside docker needs it.
      - default
      - preview
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      # Container-network overrides win over .env (the resolver still reads them from env).
      FORGEFLOW_ENV: local
      MONGODB_URI: mongodb://mongo:27017
      # Generated apps get their own cluster, reachable from the sandboxes by name.
      APP_DB_CLUSTER_URI: mongodb://forgeflow-appdb:27017
      CORS_ORIGINS: "*"
    depends_on:
      mongo:
        condition: service_healthy
      appdb:
        condition: service_healthy
    volumes:
      - ../backend:/app # hot reload; venv lives at /opt/venv (UV_PROJECT_ENVIRONMENT), not /app/.venv
      # The generated-app scaffold. In the container the backend is /app, so the code's repo-root
      # relative default (templates/app-skeleton) resolves to /templates/app-skeleton.
      - ../templates/app-skeleton:/templates/app-skeleton:ro
      # eval/ lives at the repo root (outside the backend mount). Mount it read-only so the /eval
      # dashboard + API can read host-generated eval/results/*.json (phase-44/45). In-container
      # RESULTS_DIR resolves to /eval/results, which this maps onto the host's eval/results.
      - ../eval:/eval:ro
      # The control plane creates the per-project sandboxes on the HOST daemon, so it needs the
      # socket. Without this, build/preview/test/deploy all report "Sandbox runtime unavailable".
      # Dev-only trade-off: the api container gains host-Docker (~root) access. Never in prod.
      # Colima: override with DOCKER_SOCK=${HOME}/.colima/default/docker.sock if the path is absent.
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    ports:
      - "8000:8000"

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    volumes:
      - ../frontend:/app
      - /app/node_modules # keep the image's installed modules, don't shadow with host
    ports:
      - "5173:5173"

  proxy:
    image: caddy:2
    # `always` for the same reason as `appdb` above: the only route into a sandbox must not need a
    # human to notice it is gone after a docker restart.
    restart: always
    depends_on:
      - api
      - web
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      # The proxy straddles both: reachable from the host on :80, and able to reach sandboxes
      # on the internal preview network. It is the ONLY route into a sandbox (phase-15).
      - default
      - preview

volumes:
  mongo-data:
  appdb-data:
  caddy-data:
  caddy-config:

networks:
  default:
  preview:
    name: forgeflow-preview
    # **external on purpose — the sandbox manager owns this network, not compose.**
    #
    # `internal` is the isolation guarantee: sandboxes joined here can be reached by the proxy and
    # reach each other's dev servers, but have NO route to the host or the internet. The sandbox
    # manager (phase-11) creates each container on its OWN internal network and only joins it here
    # while preview runs — and it creates *this* network on demand too (a preview can start before
    # the stack does). Two owners meant a race: whichever created it first won, and if the manager
    # got there first compose refused to start at all —
    #   "network forgeflow-preview was found but has incorrect label com.docker.compose.network"
    # — which took the whole proxy down and left every preview URL refusing connections. So compose
    # only ever *attaches*; `make dev` creates it first (idempotently) if it does not exist yet.
    external: true
