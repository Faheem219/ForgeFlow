# ForgeFlow local dev stack: api + web + mongo + proxy.
# Bring up with `make dev` (needs Colima/Docker running). Copy `.env.example` -> `.env` first.
name: forgeflow

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      # Container-network overrides win over .env (the resolver still reads them from env).
      FORGEFLOW_ENV: local
      MONGODB_URI: mongodb://mongo:27017
      CORS_ORIGINS: "*"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ../backend:/app # hot reload; venv lives at /opt/venv (UV_PROJECT_ENVIRONMENT), not /app/.venv
      # eval/ lives at the repo root (outside the backend mount). Mount it read-only so the /eval
      # dashboard + API can read host-generated eval/results/*.json (phase-44/45). In-container
      # RESULTS_DIR resolves to /eval/results, which this maps onto the host's eval/results.
      - ../eval:/eval:ro
    ports:
      - "8000:8000"

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    volumes:
      - ../frontend:/app
      - /app/node_modules # keep the image's installed modules, don't shadow with host
    ports:
      - "5173:5173"

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      # The proxy straddles both: reachable from the host on :80, and able to reach sandboxes
      # on the internal preview network. It is the ONLY route into a sandbox (phase-15).
      - default
      - preview

volumes:
  mongo-data:
  caddy-data:
  caddy-config:

networks:
  default:
  preview:
    name: forgeflow-preview
    # `internal` is the isolation guarantee: sandboxes joined here can be reached by the proxy
    # and reach each other's dev servers, but have NO route to the host or the internet. The
    # sandbox manager (phase-11) still creates containers with network_mode=none by default and
    # only joins them here while preview runs.
    internal: true
